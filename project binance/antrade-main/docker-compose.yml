version: '3'

services:
  antrade:
    build: ./
    container_name: telegram_interface
    command: ["python3", "main.py"]
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ANTRADE_DB_PATH: /data/antrade.sqlite3
    volumes:
      - antrade-data:/data

volumes:
  antrade-data:
